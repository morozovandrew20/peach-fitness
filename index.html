<style>
/* Layout: iOS-style phone app. Blurred large-title header with a "wave" week strip, inset grouped cards,
   round tap-to-check sets, floating rest capsule, translucent tab bar, bottom sheet when a workout closes. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --raised:#e9e9ef; --line:rgba(60,60,67,.14);
  --fg:#0b0b0f; --muted:#6e6e78; --a1:#f04a36; --a2:#ff8a5c; --on-accent:#ffffff;
  --good:#1fa85a; --good-bg:#e3f6ea; --warn:#b26a00; --bad:#d93025;
  --input:#eeeef3; --bar:rgba(246,246,250,.92); --scrim:rgba(0,0,0,.32);
  --shadow:0 12px 32px -14px rgba(20,20,40,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --grad:linear-gradient(120deg,var(--a1),var(--a2));
  --spring:cubic-bezier(.2,.9,.25,1.25); --ease:cubic-bezier(.25,.8,.25,1);
  --r:22px; --tint:5%;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --raised:#2c2c2e; --line:rgba(120,120,128,.3);
  --fg:#ffffff; --muted:#98989f; --a1:#ff6f5a; --a2:#ff9d73; --on-accent:#ffffff;
  --good:#32d074; --good-bg:#12301f; --warn:#ffcc55; --bad:#ff6961;
  --input:#2c2c2e; --bar:rgba(18,18,20,.9); --scrim:rgba(0,0,0,.55);
  --shadow:0 14px 36px -14px rgba(0,0,0,.9); color-scheme:dark } }
:root[data-theme="dark"],:root[data-look="dark"]{
  --bg:#000000; --surface:#1c1c1e; --raised:#2c2c2e; --line:rgba(120,120,128,.3);
  --fg:#ffffff; --muted:#98989f; --a1:#ff6f5a; --a2:#ff9d73; --on-accent:#ffffff;
  --good:#32d074; --good-bg:#12301f; --warn:#ffcc55; --bad:#ff6961;
  --input:#2c2c2e; --bar:rgba(18,18,20,.9); --scrim:rgba(0,0,0,.55);
  --shadow:0 14px 36px -14px rgba(0,0,0,.9); color-scheme:dark }

:root[data-look="light"]{  --bg:#f2f2f7; --surface:#ffffff; --raised:#e9e9ef; --line:rgba(60,60,67,.14);
  --fg:#0b0b0f; --muted:#6e6e78; --a1:#f04a36; --a2:#ff8a5c; --on-accent:#ffffff;
  --good:#1fa85a; --good-bg:#e3f6ea; --warn:#b26a00; --bad:#d93025;
  --input:#eeeef3; --bar:rgba(246,246,250,.92); --scrim:rgba(0,0,0,.32);
  --shadow:0 12px 32px -14px rgba(20,20,40,.28); color-scheme:light }
:root[data-accent="ocean"]{--a1:#0a84ff;--a2:#2ec4d6}
:root[data-accent="mint"]{--a1:#10b981;--a2:#8bd43a}
:root[data-accent="lavender"]{--a1:#8b5cf6;--a2:#e36bd6}
:root[data-accent="sunset"]{--a1:#ff6a00;--a2:#ffb62e}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background:color-mix(in srgb,var(--a1) var(--tint),var(--bg));color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);background:color-mix(in srgb,var(--a1) var(--tint),var(--bg))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .18s var(--ease),background .2s,color .2s,opacity .2s}
button:active{transform:scale(.95)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:transparent}
header .wrap{padding-block:14px 2px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top>div{min-width:0}
.sub{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;order:-1}
.top>div:first-child{display:flex;flex-direction:column;gap:1px}
h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-.025em;line-height:1.08}
.ring{position:relative;flex:0 0 50px;height:50px}
.ring svg{width:50px;height:50px;transform:rotate(-90deg)}
.ring circle,.hring circle{fill:none}
.ring circle{stroke-width:6}
.tr{stroke:var(--raised)} .pr{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:800}
.weeks{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;align-items:flex-end}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 44px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.wk i{display:block;width:100%;border-radius:10px;background:var(--raised);transition:background .25s,height .25s}
.wk[data-p="0"] i{height:18px} .wk[data-p="1"] i{height:28px} .wk[data-p="2"] i{height:40px} .wk[data-p="3"] i{height:8px;opacity:.6}
.wk.done i{background:var(--good)}
.wk[aria-pressed="true"] i{background:var(--grad)}
.wk span{font-size:12px;font-weight:700;color:var(--muted)}
.wk[aria-pressed="true"] span{color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--raised);border-radius:11px;padding:2px}
.seg button{border:0;background:transparent;font-weight:600;font-size:14px;padding:8px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px -2px rgba(0,0,0,.25)}

main .wrap{padding-block:16px calc(160px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#view.in>*{animation:rise .45s var(--ease) both}
#view.in>*:nth-child(2){animation-delay:.04s} #view.in>*:nth-child(3){animation-delay:.08s} #view.in>*:nth-child(4){animation-delay:.12s} #view.in>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center}
.hring{position:relative;flex:0 0 84px;height:84px}
.hring svg{width:84px;height:84px;transform:rotate(-90deg)}
.hring circle{stroke-width:10}
.hring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:17px;font-weight:800}
.htxt{min-width:0;display:flex;flex-direction:column;gap:3px}
.cap{font-size:12px;font-weight:700;color:var(--a1);text-transform:uppercase;letter-spacing:.05em}
.hero strong{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:13.5px;color:var(--muted)}
.note{background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14px;border-left:4px solid var(--a1)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.ex-head{display:flex;gap:10px;align-items:center}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--raised);font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:13px;transition:background .3s,color .3s}
.fin .num{background:var(--good);color:var(--surface)}
h2{font-size:17px;font-weight:700;margin:0;min-width:0;text-wrap:balance;line-height:1.2;letter-spacing:-.01em}
.plan{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plan b{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.plan span{font-weight:600;color:var(--muted);font-size:14px}
.hint{font-size:13px;font-weight:600;color:var(--a1);margin:0}
.meta{font-size:13px;color:var(--muted);margin:0}
.sets{display:flex;flex-direction:column;margin-top:2px}
.set{display:grid;grid-template-columns:18px 1fr 1fr 44px;gap:8px;align-items:center;padding:7px 0;border-top:.5px solid var(--line)}
.set .n{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.field{position:relative;min-width:0}
.field input{width:100%;min-width:0;font:inherit;font-family:var(--display);font-size:20px;font-weight:700;padding:10px 40px 10px 12px;border-radius:12px;border:0;background:var(--input);color:var(--fg);transition:background .3s,color .3s}
.field input::placeholder{color:var(--muted);opacity:.5}
.field span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--muted);pointer-events:none}
.ok{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.ok svg{width:22px;height:22px;stroke:transparent;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .08s}
.set.on .field input{background:var(--good-bg)}
.set.on .ok{background:var(--good);border-color:var(--good)}
.set.on .ok svg{stroke:var(--surface);stroke-dashoffset:0}

<script>
(function(){
"use strict";
const LABEL=["лёгкая","средняя","тяжёлая ★","отдых"];
const SCHEME={1:{pct:[.725,.775,.825,.65],reps:[8,6,5,8]},2:{pct:[.65,.70,.75,.60],reps:[12,10,8,10]}};  /* waves: intermediate only */
/* levels: same program, beginner = fewer sets, more reps, further from failure (methodology: start 10–12 sets/muscle/week) */
const LEVELS={beg:{n:"Новичок",growth:"4",who:"В зале меньше полугода или впервые делаю эти упражнения",text:"По 2–3 подхода. Вес подбираешь сама и прибавляешь, когда во всех подходах выходит верхняя цифра повторений. До отказа не работаем: сначала техника."},
  mid:{n:"Средний",growth:"2.5",who:"Тренируюсь от полугода, базу делаю уверенно",text:"По 3–4 подхода. Веса в мосту, тяге и гакке приложение считает само: волны по 4 недели с неделей отдыха."},
  adv:{n:"Опытный",growth:"2",who:"Тренируюсь больше 2 лет, хорошо восстанавливаюсь",text:"Те же волны, но по 4 подхода во всех упражнениях и работа ближе к отказу. Тренировка на 10–15 минут дольше."}};
const EX={
 1:[{id:"ht",name:"Ягодичный мост со штангой",wave:true,sets:[4,4,4,2],bs:3,br:"8–12",rest:"2–3 мин",sec:150,tip:"Пауза 1–2 с вверху, подбородок к груди"},
    {id:"rdl",name:"Румынская тяга",wave:true,sets:[3,3,3,2],bs:2,br:"8–12",rest:"2–3 мин",sec:150,tip:"Колени согнуты, таз назад, гриф по ногам. Низ — там, где таз перестал уходить назад. Слабый хват — возьми лямки"},
    {id:"bulg",name:"Болгарские выпады с наклоном",sets:3,bs:2,as:4,range:"8–10",per:" на ногу",rest:"2 мин",sec:120,tip:"Корпус вперёд, толчок пяткой передней ноги"},
    {id:"abd",name:"Отведение бедра в тренажёре",sets:3,bs:2,as:4,iso:true,range:"15–20",per:"",rest:"90 с",sec:90,tip:"Пауза в крайней точке, без рывков"}],
 2:[{id:"sq",name:"Гакк (или Смит, если свободен)",wave:true,sets:[4,4,4,2],bs:3,br:"8–12",rest:"2–3 мин",sec:150,tip:"Глубокая амплитуда, стопы выше и шире"},
    {id:"hyper",name:"Гиперэкстензия на ягодицы",sets:3,bs:2,as:4,iso:true,range:"12–15",per:"",rest:"90 с",sec:90,tip:"Спина скруглена, стопы врозь, толчок тазом"},
    {id:"kick",name:"Кикбэк в кроссовере",sets:3,bs:2,as:4,iso:true,range:"12–15",per:" на ногу",rest:"90 с",sec:90,tip:"Без прогиба в пояснице, пауза сзади"},
    {id:"curl",name:"Сгибание ног сидя",since:2,sets:3,bs:2,as:4,iso:true,range:"10–15",per:"",rest:"90 с",sec:90,tip:"Корпус чуть вперёд — сильнее растяжение, вниз медленно"}]
};
const LIFTS=[{id:"ht",name:"Ягодичный мост",day:1},{id:"rdl",name:"Румынская тяга",day:1},{id:"sq",name:"Гакк / Смит",day:2}];
const LS="volny-v1";
const def=()=>({v:1,updatedAt:0,startSet:false,growth:2.5,
  start:{ht:{w:110,r:8,step:2.5},rdl:{w:70,r:8,step:2.5},sq:{w:70,r:10,step:2.5}},
  log:{},notes:{},dates:{},cur:{w:1,d:1},theme:{accent:"berry",look:"auto"},bar:{ht:20,rdl:20,sq:0},awake:true,easy:{},noRest:{},alt:{},altAt:{},custom:{},body:[],photo:{},seen:{},backupAt:0,level:"mid",lvAt:{},calib:{},verAt:{},seed:{},sessions:{},warm:[],block:1});
let S=def(), tab="train", docRef=null, cloud="wait";

/* ---------- maths (same rules as the Excel file) ---------- */
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)&&n>0?n:0};
const fmt=n=>(Math.round(n*10)/10).toString().replace(".",",");
const fk=n=>(Math.round(n*100)/100).toString().replace(".",",");
const growth=()=>{const n=parseFloat(String(S.growth??"").replace(",","."));return isFinite(n)&&n>=0?n/100:0.025};
const SHORT={curl:"Сгибание ног",ht:"Ягодичный мост",rdl:"Румынская тяга",bulg:"Болгарские выпады",abd:"Отведение бедра",sq:"Гакк",hyper:"Гиперэкстензия",kick:"Кикбэк"};
const kgf=n=>Math.round(n).toLocaleString("ru-RU");
const ph=w=>{const p=(w-1)%4;return p===3&&S.noRest&&S.noRest[w]?1:p},   /* a skipped rest week repeats the medium week */
  wkHas=w=>[1,2].some(d=>EXD(w,d).some(ex=>rows(w,ex.id).some(full))), wave=w=>Math.floor((w-1)/4)+1;
const lvl=w=>{const v=(S.lvAt||{})[w];return LEVELS[v]?v:(LEVELS[S.level]?S.level:"mid")}; /* level a week was trained on */
const SC=w=>SCHEME;
const isBeg=w=>lvl(w)==="beg";
const rest=w=>ph(w)===3&&!isBeg(w);                      /* beginners have no planned deload weeks */
const wkLabel=w=>isBeg(w)?"неделя "+w:LABEL[ph(w)];
const asBeg=(ex,w)=>ex.wave&&(isBeg(w)||ex.alt)?Object.assign({},ex,{wave:false,range:ex.range||ex.br,per:ex.per||"",sets:ex.sets[0],main:true}):ex;  /* main lift without waves: beginner, or a swapped exercise */
const setsAt=(ex,w)=>{const L=lvl(w);if(L==="beg"&&ex.bs!==undefined)return ex.bs;if(ex.wave)return ex.sets[ph(w)];const n=L==="adv"&&ex.as?ex.as:ex.sets;return ph(w)===3?Math.min(2,n):n};
const liftDay=id=>LIFTS.find(l=>l.id===id).day;
const rows=(w,id)=>S.log[w+"-"+id]||[];
const full=r=>{if(!r)return false;const k=String(r[0]??"").trim(),n=parseFloat(k.replace(",","."));return k!==""&&isFinite(n)&&n>=0&&num(r[1])>0};
function e1(w,id){let m=0;for(const r of rows(w,id))if(full(r))m=Math.max(m,num(r[0])*(1+num(r[1])/30));return m}
/* beginner calibration: the start of a lift comes from the first week it was trained,
   sets picked "with 2–3 reps in reserve", so 2 reps are added to the estimate (practice, corrected at the first ★) */
const calibOn=id=>!!(S.calib&&S.calib[id]);
function calibWeek(id){let b=0;for(let w=1;w<=12;w++)if(isBeg(w)&&!altOf(w,id)&&rows(w,id).some(full))b=w;if(b)return b;  /* after beginner weeks: the latest of them */
  for(let w=1;w<=12;w++)if(!altOf(w,id)&&rows(w,id).some(full))return w;return 0}
const pick=(id,w)=>{if(!calibOn(id))return false;const c=calibWeek(id);return !c||w<=c};
function calibE1(id){const c=calibWeek(id);if(!c)return 0;let m=0;for(const r of rows(c,id))if(full(r))m=Math.max(m,num(r[0])*(1+(num(r[1])+2)/30));return m}
function base(id,wv){
  const s=S.start[id], g=growth();
  if(wv===1) return calibOn(id)?calibE1(id):num(s.w)*(1+num(s.r)/30);
  const prev=base(id,wv-1), tw=(wv-1)*4-1, test=e1(tw,id);
  if(isBeg(tw)||altOf(tw,id)) return prev;                                     /* that wave was trained as a beginner: the start already holds it */
  if(easy(tw,liftDay(id))) return prev;                          /* ★ day taken easy: keep the weights */
  if(!test) return prev*(1+g);                                   /* no ★ recorded: default growth */
  const planE1=planKg(id,tw)*(1+SC(tw)[liftDay(id)].reps[2]/30); /* what "exactly the plan" is worth */
  return test>=planE1*0.999 ? Math.max(prev,Math.min(test,prev*(1+2*g)))   /* plan done: never go down, grow up to the cap */
                            : Math.max(prev*0.95,test);                    /* plan missed: step back, at most 5% */
}
function planKg(id,w){const st=num(S.start[id].step)||2.5;return Math.round(base(id,wave(w))*SC(w)[liftDay(id)].pct[ph(w)]/st)*st}
function keepAlt(id){S.altAt=S.altAt||{};const cur=(S.alt||{})[id]||0;   /* weeks already trained keep the exercise they were done with */
  for(let x=1;x<=12;x++)if(S.altAt[x+"-"+id]===undefined&&rows(x,id).some(full))S.altAt[x+"-"+id]=cur}
function newBlock(){               /* carry working weights into a fresh 12 weeks */
  const seed={};
  for(const ex of EX[1].concat(EX[2])){
    for(let w=12;w>=1&&!seed[ex.id];w--){const r=rows(w,ex.id).filter(full);if(r.length&&!rest(w))seed[ex.id]={alt:altOf(w,ex.id),r}}
    if(!seed[ex.id]&&(S.seed||{})[ex.id])seed[ex.id]=S.seed[ex.id]}
  for(const l of LIFTS){
    let e=0;
    if(S.level==="beg"){const q=seed[l.id];if(q)for(const r of q.r)e=Math.max(e,num(r[0])*(1+(num(r[1])+2)/30))}
    else e=e1(11,l.id)&&!easy(11,l.day)&&!isBeg(11)?base(l.id,4):base(l.id,3);
    if(e>0){const st=num(S.start[l.id].step)||2.5;S.start[l.id].w=fk(Math.round(e/(1+8/30)/st)*st);S.start[l.id].r="8";if(S.calib)delete S.calib[l.id]}
  }
  S.log={};S.notes={};S.dates={};S.easy={};S.noRest={};S.photo={};S.altAt={};S.lvAt={};S.verAt={};S.sessions={};S.warm=[];S.seed=seed;S.cur={w:1,d:1};S.backupAt=0;S.block=(S.block||1)+1;S.startSet=true;
}
function tonnage(w,d){let t=0;for(const ex of EX[d])for(const r of rows(w,ex.id))t+=num(r[0])*num(r[1]);return t}
const PV=2;                                                      /* program version: 2 = seated leg curl added */
function dayVer(w,d){const v=(S.verAt||{})[w+"-"+d];if(v)return v;return EX[d].some(ex=>!ex.since&&rows(w,ex.id).some(full))?1:PV}
const EXD=(w,d)=>EX[d].filter(ex=>(ex.since||1)<=dayVer(w,d));
const easy=(w,d)=>!!(S.easy&&S.easy[w+"-"+d]);
const nSets=(ex,w)=>{const n=setsAt(ex,w), d=EX[1].some(x=>x.id===ex.id)?1:2;return easy(w,d)?Math.max(2,n-1):n};
